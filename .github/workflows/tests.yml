name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit tests (incl. invariants I1–I8)
        run: python -m pytest
      - name: Instrument harness (simulation; fails if any instrument fails)
        run: python -m lce_validation.run_all --out /tmp/lce_run
