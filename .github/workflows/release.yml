# Swarmbly AI — signed release artifacts.
#
# Triggered by a version tag (vX.Y.Z) or manually with an existing tag.
# Everything is signed with Sigstore keyless: the GitHub Actions OIDC identity
# is the signer, no key is stored anywhere.  The macOS/Windows jobs are
# placeholders until the maintainer adds the secrets in
# docs/releases/SIGNING.md; without them those jobs skip with a notice.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  signing_secrets:
    name: Optional OS signing secrets
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.macos.outputs.present }}
      windows: ${{ steps.windows.outputs.present }}
    steps:
      - name: macOS signing secrets
        id: macos
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$NOTARY_APPLE_ID" ] \
             && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets found; the signed/notarised .pkg job is still a placeholder (docs/releases/SIGNING.md)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS Developer ID signing and notarisation skipped: no complete secret set. Gatekeeper will warn (docs/releases/SIGNING.md)."
          fi
      - name: Windows signing secrets
        id: windows
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          if { [ -n "$PFX" ] && [ -n "$PFX_PASSWORD" ]; } \
             || { [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] \
                  && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_ENDPOINT" ] \
                  && [ -n "$AZURE_ACCOUNT" ] && [ -n "$AZURE_PROFILE" ]; }; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows signing secrets found; the Authenticode job is still a placeholder (docs/releases/SIGNING.md)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows Authenticode skipped: no complete certificate or Azure Trusted Signing secret set. SmartScreen will warn (docs/releases/SIGNING.md)."
          fi

  macos_placeholder:
    name: macOS Developer ID + notarisation (placeholder)
    needs: signing_secrets
    if: needs.signing_secrets.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder
        run: |
          echo "::warning::macOS signing secrets are present, but the signed/notarised .pkg step is not implemented yet."
          echo "Add the Developer ID build, codesign and notarytool steps described in docs/releases/SIGNING.md."

  windows_placeholder:
    name: Windows Authenticode (placeholder)
    needs: signing_secrets
    if: needs.signing_secrets.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder
        run: |
          Write-Host "::warning::Windows signing secrets are present, but the Authenticode step is not implemented yet."
          Write-Host "Add the signtool or Azure Trusted Signing steps described in docs/releases/SIGNING.md."

  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: vars
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::A release tag must look like vX.Y.Z, got '$tag'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "identity=https://github.com/${GITHUB_WORKFLOW_REF}" >> "$GITHUB_OUTPUT"
          echo "https://github.com/${GITHUB_WORKFLOW_REF}"

      - name: Build source archives with the component lock
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="swarmbly-${VERSION}/" \
            -o "dist/swarmbly-${VERSION}-source.tar.gz" HEAD
          git archive --format=zip --prefix="swarmbly-${VERSION}/" \
            -o "dist/swarmbly-${VERSION}-source.zip" HEAD
          ls -lh dist

      - name: Build the installer bundle
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          stage="build/swarmbly-${VERSION}"
          mkdir -p "$stage"
          cp install.sh install.command install.bat install.ps1 README.md LICENSE NOTICE \
             components.lock "$stage"/
          cp -R installer SwarmblyCore SwarmblyLCE SwarmblyApp scripts "$stage"/
          mkdir -p "$stage/docs/releases"
          cp docs/INSTALL.md "$stage/docs"/
          cp docs/releases/SIGNING.md "$stage/docs/releases/"
          cp -R docs/beta "$stage/docs/"
          find "$stage" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$stage" -type f -name '*.pyc' -delete
          tar --exclude='__pycache__' --exclude='*.pyc' -czf \
            "dist/swarmbly-${VERSION}-installer.tar.gz" -C build "swarmbly-${VERSION}"
          (cd build && zip -qr "../dist/swarmbly-${VERSION}-installer.zip" \
            "swarmbly-${VERSION}" -x '*/__pycache__/*' '*.pyc')
          ls -lh dist

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: "v2.6.5"

      - name: Resolve the Docker image digest
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/swarmbly"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=""
          for attempt in $(seq 1 60); do
            if digest="$(docker buildx imagetools inspect "${image}:${TAG}" \
                --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              digest="$(echo "$digest" | tr -d '"[:space:]')"
              [ -n "$digest" ] && break
            fi
            echo "waiting for ${image}:${TAG} (${attempt}/60)"
            sleep 30
          done
          if [ -z "$digest" ]; then
            echo "::error::The Docker image ${image}:${TAG} was not published by the docker workflow."
            exit 1
          fi
          {
            echo "image=${image}"
            echo "tag=${TAG}"
            echo "digest=${digest}"
            echo "reference=${image}@${digest}"
          } > "dist/swarmbly-${TAG#v}-docker-image.txt"
          cat "dist/swarmbly-${TAG#v}-docker-image.txt"

      - name: Verify the Docker image signature (warning only)
        continue-on-error: true
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/swarmbly"
          reference="$(grep '^reference=' "dist/swarmbly-${TAG#v}-docker-image.txt" | cut -d= -f2-)"
          cosign verify "$reference" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Write signing metadata
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          IDENTITY: ${{ steps.vars.outputs.identity }}
        run: |
          cat > "dist/SIGNING.txt" <<EOF
          tag=${TAG}
          version=${VERSION}
          signer_identity=${IDENTITY}
          certificate_oidc_issuer=https://token.actions.githubusercontent.com
          signed_file=SHA256SUMS
          cosign_version=$(cosign version --json | tr -d '\n')
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          verify=python scripts/verify_release.py --dir .
          EOF

      - name: Write SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with Sigstore keyless
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
          ls -lh dist/SHA256SUMS*

      - name: Verify the signature immediately
        env:
          IDENTITY: ${{ steps.vars.outputs.identity }}
        run: |
          cosign verify-blob --bundle dist/SHA256SUMS.bundle \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Swarmbly AI ${VERSION}" --generate-notes
          fi
