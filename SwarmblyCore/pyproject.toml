[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmbly-v0"
version = "0.1.0"
description = "V0 coherence-tax harness for the Swarmbly AI protocol: measures the quality cost of fragmenting a prompt and reassembling it locally."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Sebastián A. Espinoza-Ulloa" }]
keywords = [
  "distributed-inference", "decentralized-ai", "peer-to-peer",
  "prompt-decomposition", "skeleton-of-thought", "coherence",
  "small-language-models", "genome-assembly", "agpl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
http = ["httpx>=0.27"]
embeddings = ["sentence-transformers>=3.0"]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8.0"]
all = ["httpx>=0.27", "sentence-transformers>=3.0", "spacy>=3.7", "pytest>=8.0"]

[project.scripts]
swarmbly-v0 = "swarmbly_v0.cli:main"

[project.urls]
Repository = "https://github.com/Sebastardito/Swarmbly-AI"
Documentation = "https://github.com/Sebastardito/Swarmbly-AI/tree/main/docs"

[tool.setuptools.packages.find]
include = ["swarmbly_v0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
