[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmbly-agent"
version = "0.1.0"
description = "Small, dependency-free agent runtime for Swarmbly AI: a bounded local loop with injected model, tool executor and policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Sebastián A. Espinoza-Ulloa" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Sebastardito/Swarmbly-AI"
Documentation = "https://github.com/Sebastardito/Swarmbly-AI/tree/main/docs"

[tool.setuptools.packages.find]
include = ["swarmbly_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
