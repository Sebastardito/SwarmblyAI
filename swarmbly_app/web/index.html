<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Swarmbly</title>
  <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Swarmbly">
      <div class="brand" id="brand"></div>
      <nav class="nav" id="nav" aria-label="Sections">
        <button class="nav-btn" data-view="chat" type="button"><span class="nav-glyph" aria-hidden="true">⬡</span><span data-i18n="nav.chat">Chat</span></button>
        <button class="nav-btn" data-view="swarm" type="button"><span class="nav-glyph" aria-hidden="true">⬢</span><span data-i18n="nav.swarm">Swarm</span></button>
        <button class="nav-btn" data-view="memory" type="button"><span class="nav-glyph" aria-hidden="true">≋</span><span data-i18n="nav.memory">Memory</span></button>
        <button class="nav-btn" data-view="settings" type="button"><span class="nav-glyph" aria-hidden="true">⚙</span><span data-i18n="nav.settings">Settings</span></button>
      </nav>
      <section class="node-card" id="node-card" aria-live="polite"></section>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <section class="view" id="view-chat"></section>
      <section class="view" id="view-swarm"></section>
      <section class="view" id="view-memory"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <aside class="activity" id="activity" aria-label="Activity">
      <header class="activity-head">
        <h2 data-i18n="activity.title">Current request</h2>
        <button class="icon-btn" id="activity-close" type="button" data-i18n-title="activity.hide" aria-label="Hide">×</button>
      </header>
      <p class="activity-sub" id="activity-sub"></p>
      <div id="activity-helix"></div>
    </aside>
  </div>
  <button class="activity-fab" id="activity-open" type="button" data-i18n="activity.show">Pipeline</button>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/md.js"></script>
  <script src="/js/mermaid.js"></script>
  <script src="/js/helix.js"></script>
  <script src="/js/swarmgraph.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/monitor.js"></script>
  <script src="/js/lce.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/wizard.js"></script>
</body>
</html>
