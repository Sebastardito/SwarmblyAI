name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare with the launcher
        run: PYTHON=python ./launch.sh --setup-only --dev --yes --no-ollama
      - name: Launcher self-check
        run: PYTHON=python ./launch.sh --check --no-ollama
      - name: Optional extras exercised by the tests (MCP client, agent runtime)
        run: .venv/bin/python -m pip install -e ".[dev,tools,agent]"
      - name: Tests
        run: .venv/bin/python -m pytest -W error::RuntimeWarning

  # The P2P layer had no Windows coverage: its TLS sockets, asyncio loop and
  # path handling are platform-sensitive. Run the loopback multi-node tests
  # (real TLS, handshake, packets, worker policy) on a Windows runner too.
  # mDNS discovery is skipped there (see TestDiscoveryWithoutIPs); everything
  # else uses 127.0.0.1 and does not depend on multicast.
  p2p-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the app with the test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: P2P, handshake, messages and worker policy
        run: python -m pytest -W error::RuntimeWarning tests/test_handshake.py tests/test_messages.py tests/test_p2p_two_nodes.py tests/test_worker_policy.py
