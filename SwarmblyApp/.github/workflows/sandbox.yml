name: sandbox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sandbox:
    name: sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 on GitHub's current runners. Windows has no
        # RLIMIT_FSIZE (R-006): the hard-cap test is xfail there, while network
        # and filesystem checks still run.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the app with the [sandbox] extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sandbox,dev]"
      - name: Sandbox escape and function tests
        run: python -m pytest -m sandbox -q -rfE
