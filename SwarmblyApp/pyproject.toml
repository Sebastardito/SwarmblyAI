[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmbly-app"
version = "0.8.1"
description = "Swarmbly App — integrated decentralized AI client and network dashboard for SwarmblyAI + SwarmblyLCE. Fragments the problem, not the model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Sebastián A. Espinoza-Ulloa", email = "sebas_saeu@hotmail.com" }]
keywords = [
  "distributed-inference", "decentralized-ai", "peer-to-peer", "local-first",
  "small-language-models", "swarmbly", "lce", "agpl", "mdns", "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "swarmbly-v0 @ git+https://github.com/Sebastardito/SwarmblyAI.git@51eb44e8e471757f8abe2f90e60023633719fd0b",
  "swarmbly-lce @ git+https://github.com/Sebastardito/SwarmblyLCE.git@050d4ed0503431b1d46ba02a38997692ba0d4768",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "keyring>=24",
  "pypdf>=4",            # C1 reads PDFs where pdftotext (poppler) is missing
  "psutil>=5.9",
  "cryptography>=41",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
tools = ["mcp==2.3.0"]
# The agent runtime that drives MCP tools in a conversation (D-007, D-011).
# Pinned to the umbrella release tag: the App and the runtime are released
# together (D-014).
agent = [
  "swarmbly-agent @ git+https://github.com/Sebastardito/SwarmblyAI.git@v3.5.1#subdirectory=SwarmblyCore/agent",
]
# Recipe 5 sandbox (D-010). Exact pins, deliberately not ranges: wasi-python
# 0.1.5 is young and only its named public API is promised. Upgrades require a
# new escape-test spike (D-010, R-007) and a renewed wheel-hash lock.
sandbox = ["wasi-python==0.1.5", "wasmtime==50.0.1"]  # new spike to upgrade

[project.scripts]
swarmbly-app = "swarmbly_app.cli:main"

[project.urls]
Repository = "https://github.com/Sebastardito/SwarmblyApp"
Protocol = "https://github.com/Sebastardito/SwarmblyAI"
LCE = "https://github.com/Sebastardito/SwarmblyLCE"

[tool.setuptools.packages.find]
include = ["swarmbly_app*"]

[tool.setuptools.package-data]
"swarmbly_app" = ["web/index.html", "web/css/*.css", "web/js/*.js",
                   "web/js/vendor/*.js", "web/i18n/*.json", "web/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "sandbox: heavy recipe-5 sandbox tests (need the [sandbox] extra; run with -m sandbox)",
]
